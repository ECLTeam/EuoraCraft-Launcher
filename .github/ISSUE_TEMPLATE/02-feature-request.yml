name: 功能建议
description: 说明使用场景、当前问题和期望效果，提出功能建议。
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索[已有 Issue](https://github.com/ECLTeam/EuoraCraft-Launcher/issues?q=is%3Aissue)，同一建议请补充到原 Issue。
        每份建议聚焦一个目标，可使用中文或英文填写，详见[贡献指南](https://github.com/ECLTeam/EuoraCraft-Launcher/blob/main/CONTRIBUTING.md)。
        标题请描述希望获得的能力或效果；无需先设计技术方案，提交建议也不代表项目已经批准实施。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issue，没有发现相同建议；如已有相同建议，我会到原 Issue 补充信息。
          required: true
        - label: 我已检查正文和附件，不含令牌、密码、账户凭据或未经脱敏的个人信息。
          required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      placeholder: 谁会在什么情况下使用这项功能？
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 目前的问题
      placeholder: 当前流程遇到了什么困难？为什么现有能力不能满足需要？
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: 期望效果
      placeholder: 希望最终可以完成什么操作，或获得什么效果？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已有替代方式
      description: 如有，说明目前如何绕行以及仍存在的不足。
    validations:
      required: false
  - type: textarea
    id: proposed-solution
    attributes:
      label: 建议实现
      description: 如有想法可以填写；无需了解项目内部技术。
    validations:
      required: false
  - type: textarea
    id: additional-information
    attributes:
      label: 补充资料
      description: 可提供相关 Issue、参考链接或已脱敏的示意图。
    validations:
      required: false
