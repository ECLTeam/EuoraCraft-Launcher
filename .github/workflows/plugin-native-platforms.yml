name: Plugin Native WebViews

on:
  push:
    branches: [codex/plugin-posix-worker]
    paths:
      - "native/pytauri-runtime/**"
      - "ECL/plugins/runtime/custom_ui*"
      - "tests/*custom_ui*"
      - "tests/*native_isolation*"
      - ".github/workflows/plugin-native-platforms.yml"
  pull_request:
    branches: [main]
    paths:
      - "native/pytauri-runtime/**"
      - "ECL/plugins/runtime/custom_ui*"
      - "tests/*custom_ui*"
      - "tests/*native_isolation*"
      - ".github/workflows/plugin-native-platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-webview:
    name: Native WebView (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.99.0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/native-target
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      ECL_NATIVE_UI_GATE: "1"
      ECL_NATIVE_RUNTIME_PATH: ${{ github.workspace }}/build/native-packages
      ECL_NATIVE_GATE_REPORT: ${{ github.workspace }}/build/native-gate.json
      ECL_NATIVE_UI_REPORT: ${{ github.workspace }}/build/native-worker-ui.json
      ECL_NATIVE_TRACE_DIRECTORY: ${{ github.workspace }}/build/native-traces
      LIBGL_ALWAYS_SOFTWARE: "1"
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install WebKitGTK and virtual desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
          pkg-config --modversion webkit2gtk-4.1
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Restore native compiler cache
        uses: actions/cache/restore@v4
        with:
          path: build/native-target
          key: plugin-native-${{ runner.os }}-rust199-py311-${{ hashFiles('native/pytauri-runtime/runtime.patch', 'native/pytauri-runtime/*.rs') }}
          restore-keys: plugin-native-${{ runner.os }}-rust199-py311-
      - name: Install launcher test dependencies
        run: python -m pip install -e . pytest pytest-asyncio
      - name: Prepare fixed WebView2 runtime
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: python native/pytauri-runtime/prepare-webview2.py
      - name: Build reviewed native Wheel
        run: python native/pytauri-runtime/build-wheel.py
      - name: Save native compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/native-target
          key: plugin-native-${{ runner.os }}-rust199-py311-${{ hashFiles('native/pytauri-runtime/runtime.patch', 'native/pytauri-runtime/*.rs') }}
      - name: Install Wheel in isolated test directory
        run: >-
          python -m pip install --target build/native-packages --no-index --no-deps --require-hashes
          --find-links build/native-runtime/wheels -r build/native-runtime/install.txt
      - name: Verify native isolation and real Worker windows
        timeout-minutes: 6
        run: |
          python - <<'PY'
          import os
          import json
          import subprocess
          import sys
          from pathlib import Path
          arguments = [sys.executable, "-m", "pytest", "--tb=short", "-q", "--maxfail=1", "--junitxml=build/native-ui.xml",
                       "tests/test_plugin_native_isolation.py", "tests/test_plugin_custom_ui.py", "-k", "native"]
          if sys.platform == "linux":
              arguments = ["dbus-run-session", "--", "xvfb-run", "-a", "-s", "-screen 0 1280x800x24", *arguments]
          environment = dict(os.environ, PYTHONPATH=os.environ["ECL_NATIVE_RUNTIME_PATH"])
          if sys.platform == "win32":
              environment["WEBVIEW2_BROWSER_EXECUTABLE_FOLDER"] = Path("build/webview2-fixed/install-path.txt").read_text(encoding="utf-8")
              manifest = json.loads(Path("native/pytauri-runtime/source.json").read_text(encoding="utf-8"))
              environment["ECL_EXPECTED_NATIVE_ENGINE"] = manifest["webview2_version"]
          subprocess.run(arguments, check=True, env=environment)
          PY
      - name: Reject empty or skipped native coverage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("build/native-ui.xml").iter("testcase"))
          if len(cases) < 3 or any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")):
              raise SystemExit("Required real WebView coverage is incomplete")
          print(f"Native GUI: {len(cases)} required cases passed")
          PY
      - name: Preserve native sources, Wheels and original reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-native-${{ matrix.os }}
          path: |
            build/native-runtime/build-manifest.json
            build/native-runtime/install.txt
            build/native-runtime/wheels/*.whl
            build/native-ui.xml
            build/native-gate.json
            build/native-worker-ui.json
            build/native-traces/*.jsonl
            native/pytauri-runtime/source.json
            native/pytauri-runtime/runtime.patch
            native/pytauri-runtime/plugin_isolation*.rs
          if-no-files-found: error
