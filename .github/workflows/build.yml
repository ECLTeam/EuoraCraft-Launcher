name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  validate-release-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      full_version: ${{ steps.release.outputs.full_version }}
      type: ${{ steps.release.outputs.type }}
      filename_version: ${{ steps.release.outputs.filename_version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve version and validate publication
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python packaging/release_metadata.py >> "$GITHUB_OUTPUT"

  build-frontend:
    name: Build Frontend
    needs: validate-release-tag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend quality
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # build backend with matrix
  build-backend:
    name: Build Backend
    needs: [validate-release-tag, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build fixed plugin window runtime
        if: ${{ runner.os == 'Windows' && runner.arch == 'X64' }}
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: "1.99.0"
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          ./native/pytauri-runtime/build-wheel.ps1 -Python python
          python -m pip install --no-index --no-deps --require-hashes --find-links build/native-runtime/wheels -r build/native-runtime/install.txt
          if ($LASTEXITCODE -ne 0) { throw 'Fixed plugin runtime installation failed' }

      - name: Preserve plugin runtime build manifest
        if: ${{ runner.os == 'Windows' && runner.arch == 'X64' }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-native-runtime-${{ runner.arch }}
          path: |
            build/native-runtime/build-manifest.json
            build/native-runtime/install.txt
            build/native-runtime/wheels/*.whl
            native/pytauri-runtime/source.json
            native/pytauri-runtime/runtime.patch
            native/pytauri-runtime/plugin_isolation.rs
          if-no-files-found: error

      - name: Install UPX
        if: ${{ runner.os != 'macOS' && matrix.os != 'windows-11-arm' }}
        uses: crazy-max/ghaction-upx@v4
        with:
          version: v5.2.0
          install-only: true

      - name: Inject build secrets
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python - <<'PY'
          import os, re
          path = "ECL/foundation/build_env.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          cid = os.environ.get("CLIENT_ID", "")
          cfk = os.environ.get("CF_API_KEY", "")
          text = re.sub(r'microsoft_client_id\s*=\s*"[^"]*"', f'microsoft_client_id = "{cid}"', text)
          text = re.sub(r'curseforge_api_key\s*=\s*"[^"]*"', f'curseforge_api_key = "{cfk}"', text)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Inject version info into version.py
        shell: bash
        env:
          VTYPE: ${{ needs.validate-release-tag.outputs.type }}
          VVER: ${{ needs.validate-release-tag.outputs.full_version }}
        run: |
          python - <<'PY'
          import os, re
          vtype = os.environ["VTYPE"]
          vver = os.environ["VVER"]
          if not vtype or not vver:
              raise ValueError("构建版本信息缺失")
          path = "ECL/foundation/version.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          # Update __version__ with the full version (pre-release and build metadata included)
          text = re.sub(
              r"""__version__\s*=\s*['"][^'"]*['"]""",
              f'__version__ = "{vver}"',
              text,
          )
          # Update __version_type__
          text = re.sub(
              r"""__version_type__\s*=\s*['"][^'"]*['"]""",
              f'__version_type__ = "{vtype}"',
              text,
          )
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print(f"Injected version={vver}, version_type={vtype}")
          PY

      - name: Generate host dependency manifest
        shell: bash
        run: python packaging/build-host-dependencies.py

      - name: Build with Nuitka
        if: ${{ runner.os != 'macOS' }}
        shell: bash
        env:
          VTYPE: ${{ needs.validate-release-tag.outputs.type }}
        run: |
          set -euo pipefail
          # macOS 改由 PyInstaller 构建（见下方 Build with PyInstaller）；
          # 其余平台 onefile（关闭内置 zstd，由 UPX 直接压缩整体负载，实测更小）
          # windows-11-arm 无可用 UPX ARM64 发行版，使用 onefile 内置 zstd 压缩
          if [ "$RUNNER_OS" = "Windows" ] && [ "${{ matrix.os }}" = "windows-11-arm" ]; then
            ARGS=(--mode=onefile --assume-yes-for-downloads --output-dir=build-nuitka)
          else
            ARGS=(--mode=onefile --onefile-no-compression --assume-yes-for-downloads --output-dir=build-nuitka)
            if command -v upx >/dev/null 2>&1; then
              ARGS+=(--enable-plugin=upx)
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARGS+=(--windows-icon-from-ico=resources/img/logo.ico)
            # easytier 的 Packet.dll / wintun.dll 在运行时动态加载，需显式随包分发
            ETP_DIR="$(python -c 'import easytier_pyo3, os; print(os.path.dirname(easytier_pyo3.__file__).replace("\\", "/"))')"
            ARGS+=(--include-data-files="$ETP_DIR/Packet.dll=easytier_pyo3/Packet.dll")
            ARGS+=(--include-data-files="$ETP_DIR/wintun.dll=easytier_pyo3/wintun.dll")
            # beta/release 面向普通用户隐藏控制台；alpha/dev 保留控制台便于排查启动问题
            CONSOLE_MODE="force"
            if [ "${ECL_CONSOLE:-}" = "1" ]; then
              CONSOLE_MODE="force"
            elif [ "${ECL_CONSOLE:-}" = "0" ]; then
              CONSOLE_MODE="disable"
            elif [ "$VTYPE" = "beta" ] || [ "$VTYPE" = "rc" ] || [ "$VTYPE" = "release" ]; then
              CONSOLE_MODE="disable"
            fi
            ARGS+=(--windows-console-mode="$CONSOLE_MODE")
          fi
          python -m nuitka "${ARGS[@]}" \
            --include-package=ECL \
            --include-package=pytauri \
            --include-package=pytauri_plugins \
            --include-package=pytauri_utils \
            --include-package=pytauri_wheel \
            --include-module=pytauri_wheel.ext_mod \
            --include-distribution-metadata=pytauri-wheel \
            --include-package-data=easytier_pyo3 \
            --include-raw-dir=resources=resources \
            --include-data-dir=frontend/dist=frontend/dist \
            --include-data-dir=capabilities=capabilities \
            --include-data-files=Tauri.toml=Tauri.toml \
            main.py

      # macOS 用 PyInstaller 出 .app bundle（规格见 EuoraCraft-Launcher.spec），打包步骤再压成 DMG
      - name: Build with PyInstaller
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean "EuoraCraft-Launcher.spec"

      - name: Package artifact
        id: package
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cd dist
            hdiutil create -volname "EuoraCraft Launcher" -srcfolder "EuoraCraft Launcher.app" -ov -format UDZO "EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ needs.validate-release-tag.outputs.filename_version }}.dmg"
            echo "filename=EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ needs.validate-release-tag.outputs.filename_version }}.dmg" >> "$GITHUB_OUTPUT"
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          else
            cd build-nuitka
            echo "dir=build-nuitka" >> "$GITHUB_OUTPUT"
            if [ "${{ runner.os }}" = "Windows" ]; then
              mv "main.exe" "EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ needs.validate-release-tag.outputs.filename_version }}.exe"
              echo "filename=EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ needs.validate-release-tag.outputs.filename_version }}.exe" >> "$GITHUB_OUTPUT"
            else
              mv "main.bin" "EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ needs.validate-release-tag.outputs.filename_version }}"
              echo "filename=EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ needs.validate-release-tag.outputs.filename_version }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.filename }}
          path: ${{ steps.package.outputs.dir }}/${{ steps.package.outputs.filename }}
          archive: false

      - name: Upload to Release
        if: needs.validate-release-tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.dir }}/${{ steps.package.outputs.filename }}
          prerelease: ${{ needs.validate-release-tag.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Arch Linux 打包：GitHub 无原生 Arch hosted runner，因此在 Arch 容器中
  # 原生构建 Nuitka 产物，避免将 Ubuntu/WebKitGTK 的编译期路径带入 Arch 包。
  build-arch-pkg:
    name: Build Arch Linux package
    # 只等待共用前端产物，随后与其他平台的后端矩阵并行构建。
    needs: [validate-release-tag, build-frontend]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    outputs:
      package_artifact: ${{ steps.arch_package.outputs.filename }}
    permissions:
      contents: read
    steps:
      - name: Bootstrap Git for checkout
        # archlinux:base-devel 不包含 Git；checkout 的 REST 回退模式不支持子模块。
        run: pacman -Syu --needed --noconfirm git

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install build toolchain
        run: |
          pacman -S --needed --noconfirm \
            uv \
            gtk3 webkit2gtk-4.1 librsvg libayatana-appindicator \
            dbus \
            patchelf curl upx

      - name: Install Python dependencies
        shell: bash
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-arch
          uv pip install --python .venv-arch/bin/python -e ".[dev]"
          .venv-arch/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Generate host dependency manifest
        shell: bash
        run: .venv-arch/bin/python packaging/build-host-dependencies.py

      - name: Inject build secrets
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          .venv-arch/bin/python - <<'PY'
          import os, re
          path = "ECL/foundation/build_env.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          cid = os.environ.get("CLIENT_ID", "")
          cfk = os.environ.get("CF_API_KEY", "")
          text = re.sub(r'microsoft_client_id\s*=\s*"[^"]*"', f'microsoft_client_id = "{cid}"', text)
          text = re.sub(r'curseforge_api_key\s*=\s*"[^"]*"', f'curseforge_api_key = "{cfk}"', text)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Inject version info into version.py
        shell: bash
        env:
          VTYPE: ${{ needs.validate-release-tag.outputs.type }}
          VVER: ${{ needs.validate-release-tag.outputs.full_version }}
        run: |
          .venv-arch/bin/python - <<'PY'
          import os, re
          vtype = os.environ["VTYPE"]
          vver = os.environ["VVER"]
          if not vtype or not vver:
              raise ValueError("构建版本信息缺失")
          path = "ECL/foundation/version.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          text = re.sub(
              r'''__version__\s*=\s*['"][^'"]*['"]''',
              f'__version__ = "{vver}"',
              text,
          )
          text = re.sub(
              r'''__version_type__\s*=\s*['"][^'"]*['"]''',
              f'__version_type__ = "{vtype}"',
              text,
          )
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print(f"Injected version={vver}, version_type={vtype}")
          PY

      - name: Build Arch binary with Nuitka
        shell: bash
        run: |
          .venv-arch/bin/python -m nuitka \
            --mode=onefile --onefile-no-compression --enable-plugin=upx \
            --assume-yes-for-downloads --output-dir=build-nuitka \
            --include-package=ECL \
            --include-package=pytauri \
            --include-package=pytauri_plugins \
            --include-package=pytauri_utils \
            --include-package=pytauri_wheel \
            --include-module=pytauri_wheel.ext_mod \
            --include-distribution-metadata=pytauri-wheel \
            --include-package-data=easytier_pyo3 \
            --include-raw-dir=resources=resources \
            --include-data-dir=frontend/dist=frontend/dist \
            --include-data-dir=capabilities=capabilities \
            --include-data-files=Tauri.toml=Tauri.toml \
            main.py

      - name: Prepare source for PKGBUILD
        working-directory: packaging/arch
        shell: bash
        run: |
          SRC="$GITHUB_WORKSPACE/build-nuitka/main.bin"
          [ -x "$SRC" ] || { echo "未找到 Arch 原生二进制"; exit 1; }
          cp "$SRC" euoracraft-launcher
          cp "$SRC" "$GITHUB_WORKSPACE/EuoraCraft-Launcher-Arch-X64-${{ needs.validate-release-tag.outputs.filename_version }}"
          # CI 用本 job 的 Arch 原生产物，把 PKGBUILD 的远程 source 换成本地二进制。
          sed -i 's#^.*euoracraft-launcher::.*$#    "euoracraft-launcher"#' PKGBUILD

      - name: Build package
        working-directory: packaging/arch
        shell: bash
        env:
          PKGVER: ${{ needs.validate-release-tag.outputs.version }}
        run: |
          sed -i 's#^pkgver=.*#pkgver='"$PKGVER"'#' PKGBUILD
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE/packaging/arch"
          su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f -c --noconfirm --skipinteg"

      - name: Locate main Arch package
        id: arch_package
        working-directory: packaging/arch
        shell: bash
        run: |
          mapfile -t packages < <(
            find . -maxdepth 1 -type f \
              -name 'euoracraft-launcher-*.pkg.tar.zst' \
              ! -name 'euoracraft-launcher-debug-*.pkg.tar.zst' \
              -printf '%f\n' | sort
          )
          if [ "${#packages[@]}" -ne 1 ]; then
            printf '预期找到 1 个 Arch 主包，实际找到 %s 个：%s\n' \
              "${#packages[@]}" "${packages[*]}" >&2
            exit 1
          fi
          echo "filename=${packages[0]}" >> "$GITHUB_OUTPUT"
          echo "path=packaging/arch/${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Arch package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.arch_package.outputs.filename }}
          path: ${{ steps.arch_package.outputs.path }}
          archive: false

      - name: Upload Arch binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: EuoraCraft-Launcher-Arch-X64-${{ needs.validate-release-tag.outputs.filename_version }}
          path: EuoraCraft-Launcher-Arch-X64-${{ needs.validate-release-tag.outputs.filename_version }}
          archive: false

  publish-arch:
    name: Publish Arch-x64
    if: needs.validate-release-tag.outputs.publish == 'true'
    needs: [validate-release-tag, build-backend, build-arch-pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Arch package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-arch-pkg.outputs.package_artifact }}
          path: release-assets

      - name: Download Arch binary
        uses: actions/download-artifact@v8
        with:
          name: EuoraCraft-Launcher-Arch-X64-${{ github.ref_name }}
          path: release-assets

      - name: Upload Arch artifacts to Release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_FILE="release-assets/${{ needs.build-arch-pkg.outputs.package_artifact }}"
          ARCH_BIN="release-assets/EuoraCraft-Launcher-Arch-X64-$TAG"
          [ -f "$PKG_FILE" ] || { echo "未找到 Arch 主包：$PKG_FILE" >&2; exit 1; }
          [ -f "$ARCH_BIN" ] || { echo "未找到 Arch 二进制：$ARCH_BIN" >&2; exit 1; }
          echo "uploading $PKG_FILE and $ARCH_BIN to $TAG"
          # 本发布 Job 未 checkout 仓库，必须显式指定目标仓库，避免 gh 调用 git 推断仓库失败。
          gh release upload "$TAG" "$PKG_FILE" "$ARCH_BIN" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
