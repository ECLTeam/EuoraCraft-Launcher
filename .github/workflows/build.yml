name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-release-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" != "tag" ]; then
            exit 0
          fi

          if [[ "$TAG_NAME" != *-beta* ]]; then
            exit 0
          fi

          if [ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]; then
            echo "beta 标签必须是带注释标签：$TAG_NAME" >&2
            exit 1
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*\+[0-9]{8}$ ]]; then
            echo "不合法的 beta 标签：$TAG_NAME" >&2
            echo "beta 标签必须为 vMAJOR.MINOR.PATCH-beta.N+YYYYMMDD，例如 v0.1.0-beta.2+20260919。" >&2
            exit 1
          fi

          release_date="${TAG_NAME##*+}"
          python - "$release_date" <<'PY'
          from datetime import datetime
          from sys import argv

          datetime.strptime(argv[1], "%Y%m%d")
          PY

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          main_commit="$(git rev-parse origin/main)"
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "beta 标签必须指向 origin/main 当前提交。tag=$tag_commit main=$main_commit" >&2
            exit 1
          fi

          require_successful_main_workflow() {
            local workflow_file="$1"
            local workflow_name="$2"
            local successful_runs
            successful_runs="$(
              gh api \
                "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?head_sha=$tag_commit&branch=main&event=push&status=completed" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
            )"
            if [ "$successful_runs" = "0" ]; then
              echo "beta 标签对应提交尚未通过主分支工作流：$workflow_name" >&2
              exit 1
            fi
          }

          require_successful_main_workflow "backend-tests.yml" "Backend Tests"
          require_successful_main_workflow "build.yml" "Build"

  build-frontend:
    name: Build Frontend
    needs: validate-release-tag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend quality
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # build backend with matrix
  build-backend:
    name: Build Backend
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus-x11

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install UPX
        if: ${{ runner.os != 'macOS' && matrix.os != 'windows-11-arm' }}
        uses: crazy-max/ghaction-upx@v4
        with:
          version: v5.2.0
          install-only: true

      - name: Inject build secrets
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          python - <<'PY'
          import os, re
          path = "ECL/foundation/build_env.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          cid = os.environ.get("CLIENT_ID", "")
          cfk = os.environ.get("CF_API_KEY", "")
          text = re.sub(r'microsoft_client_id\s*=\s*"[^"]*"', f'microsoft_client_id = "{cid}"', text)
          text = re.sub(r'curseforge_api_key\s*=\s*"[^"]*"', f'curseforge_api_key = "{cfk}"', text)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Parse version from tag
        id: version_info
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # Strip v prefix, then extract version, type and build metadata
          if [[ "$TAG" == v* ]]; then
            VER="${TAG#v}"
            # Determine version type from pre-release suffix
            if [[ "$VER" == *-beta* ]]; then
              echo "type=beta" >> "$GITHUB_OUTPUT"
            elif [[ "$VER" == *-alpha* ]]; then
              echo "type=alpha" >> "$GITHUB_OUTPUT"
            elif [[ "$VER" == *-rc* ]]; then
              echo "type=rc" >> "$GITHUB_OUTPUT"
            else
              echo "type=release" >> "$GITHUB_OUTPUT"
            fi
            # Strip pre-release suffix for the semver core version
            CLEAN_VER="${VER%-*}"
            if [ "$CLEAN_VER" = "$VER" ]; then
              # No pre-release suffix, use as-is
              echo "version=$VER" >> "$GITHUB_OUTPUT"
            else
              echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
            fi
            # Full version (pre-release and build metadata included) for runtime injection
            echo "full_version=$VER" >> "$GITHUB_OUTPUT"
          else
            echo "type=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "full_version=" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$TAG" == v* ]]; then
            echo "filename_version=$TAG" >> "$GITHUB_OUTPUT"
          else
            # 无 tag 时回退到 version.py 中的版本，避免产物命名为 dev
            VER_PY=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' ECL/foundation/version.py)
            TYPE_PY=$(sed -n 's/^__version_type__ = "\([^"]*\)".*/\1/p' ECL/foundation/version.py)
            if [ -n "$VER_PY" ]; then
              # version.py 已含预发布/构建元数据时直接使用；旧格式（纯版本号+类型）再拼上类型
              if [[ "$VER_PY" != *-* ]] && [ -n "$TYPE_PY" ] && [ "$TYPE_PY" != "release" ]; then
                echo "filename_version=v${VER_PY}-${TYPE_PY}" >> "$GITHUB_OUTPUT"
              else
                echo "filename_version=v${VER_PY}" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "filename_version=dev" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Inject version info into version.py
        shell: bash
        env:
          VTYPE: ${{ steps.version_info.outputs.type }}
          VVER: ${{ steps.version_info.outputs.full_version }}
        run: |
          python - <<'PY'
          import os, re
          vtype = os.environ.get("VTYPE", "")
          vver = os.environ.get("VVER", "")
          if vtype and vver:
              path = "ECL/foundation/version.py"
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              # Update __version__ with the full version (pre-release and build metadata included)
              text = re.sub(
                  r"""__version__\s*=\s*['"][^'"]*['"]""",
                  f'__version__ = "{vver}"',
                  text,
              )
              # Update __version_type__
              text = re.sub(
                  r"""__version_type__\s*=\s*['"][^'"]*['"]""",
                  f'__version_type__ = "{vtype}"',
                  text,
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
              print(f"Injected version={vver}, version_type={vtype}")
          else:
              print("No tag detected, keeping existing version.py")
          PY

      - name: Generate host dependency manifest
        shell: bash
        run: python packaging/build-host-dependencies.py

      - name: Smoke test offline plugin dependency installation
        shell: bash
        run: python -m pytest tests/test_plugin_environment_pool.py tests/test_plugin_package_preparation.py tests/test_plugin_manager_packages.py -q

      - name: Build with Nuitka
        if: ${{ runner.os != 'macOS' }}
        shell: bash
        env:
          VTYPE: ${{ steps.version_info.outputs.type }}
        run: |
          set -euo pipefail
          # macOS 改由 PyInstaller 构建（见下方 Build with PyInstaller）；
          # 其余平台 onefile（关闭内置 zstd，由 UPX 直接压缩整体负载，实测更小）
          # windows-11-arm 无可用 UPX ARM64 发行版，使用 onefile 内置 zstd 压缩
          if [ "$RUNNER_OS" = "Windows" ] && [ "${{ matrix.os }}" = "windows-11-arm" ]; then
            ARGS=(--mode=onefile --assume-yes-for-downloads --output-dir=build-nuitka)
          else
            ARGS=(--mode=onefile --onefile-no-compression --assume-yes-for-downloads --output-dir=build-nuitka)
            if command -v upx >/dev/null 2>&1; then
              ARGS+=(--enable-plugin=upx)
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARGS+=(--windows-icon-from-ico=resources/img/logo.ico)
            # easytier 的 Packet.dll / wintun.dll 在运行时动态加载，需显式随包分发
            ETP_DIR="$(python -c 'import easytier_pyo3, os; print(os.path.dirname(easytier_pyo3.__file__).replace("\\", "/"))')"
            ARGS+=(--include-data-files="$ETP_DIR/Packet.dll=easytier_pyo3/Packet.dll")
            ARGS+=(--include-data-files="$ETP_DIR/wintun.dll=easytier_pyo3/wintun.dll")
            # beta/release 面向普通用户隐藏控制台；alpha/dev 保留控制台便于排查启动问题
            CONSOLE_MODE="force"
            if [ "${ECL_CONSOLE:-}" = "1" ]; then
              CONSOLE_MODE="force"
            elif [ "${ECL_CONSOLE:-}" = "0" ]; then
              CONSOLE_MODE="disable"
            elif [ "$VTYPE" = "beta" ] || [ "$VTYPE" = "rc" ] || [ "$VTYPE" = "release" ]; then
              CONSOLE_MODE="disable"
            fi
            ARGS+=(--windows-console-mode="$CONSOLE_MODE")
          fi
          python -m nuitka "${ARGS[@]}" \
            --include-package=ECL \
            --include-package=pytauri \
            --include-package=pytauri_plugins \
            --include-package=pytauri_utils \
            --include-package=pytauri_wheel \
            --include-module=pytauri_wheel.ext_mod \
            --include-distribution-metadata=pytauri-wheel \
            --include-package-data=easytier_pyo3 \
            --include-raw-dir=resources=resources \
            --include-data-dir=frontend/dist=frontend/dist \
            --include-data-dir=capabilities=capabilities \
            --include-data-files=Tauri.toml=Tauri.toml \
            main.py

      # macOS 用 PyInstaller 出 .app bundle（规格见 EuoraCraft-Launcher.spec），打包步骤再压成 DMG
      - name: Build with PyInstaller
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean "EuoraCraft-Launcher.spec"

      - name: Smoke test packaged plugin directories
        # 使用最终启动器验证动态安装，而非额外发布插件解释器。
        shell: bash
        env:
          PYTHONUTF8: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          set -euo pipefail
          python -m pip download --only-binary=:all: --no-deps --dest build/plugin-smoke-wheels xxhash==3.6.0
          export ECL_PLUGIN_SMOKE_WHEELS="$GITHUB_WORKSPACE/build/plugin-smoke-wheels"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export ECL_PLUGIN_SMOKE_EXECUTABLE="$GITHUB_WORKSPACE/build-nuitka/main.exe"
            python -m pytest tests/test_packaged_plugin_directories.py -q
          elif [ "$RUNNER_OS" = "macOS" ]; then
            export ECL_PLUGIN_SMOKE_EXECUTABLE="$GITHUB_WORKSPACE/dist/EuoraCraft Launcher.app/Contents/MacOS/EuoraCraft Launcher"
            python -m pytest tests/test_packaged_plugin_directories.py -q
          else
            export ECL_PLUGIN_SMOKE_EXECUTABLE="$GITHUB_WORKSPACE/build-nuitka/main.bin"
            dbus-run-session -- xvfb-run -a python -m pytest tests/test_packaged_plugin_directories.py -q
          fi

      - name: Package artifact
        id: package
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cd dist
            hdiutil create -volname "EuoraCraft Launcher" -srcfolder "EuoraCraft Launcher.app" -ov -format UDZO "EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ steps.version_info.outputs.filename_version }}.dmg"
            echo "filename=EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ steps.version_info.outputs.filename_version }}.dmg" >> "$GITHUB_OUTPUT"
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          else
            cd build-nuitka
            echo "dir=build-nuitka" >> "$GITHUB_OUTPUT"
            if [ "${{ runner.os }}" = "Windows" ]; then
              mv "main.exe" "EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ steps.version_info.outputs.filename_version }}.exe"
              echo "filename=EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ steps.version_info.outputs.filename_version }}.exe" >> "$GITHUB_OUTPUT"
            else
              mv "main.bin" "EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ steps.version_info.outputs.filename_version }}"
              echo "filename=EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ steps.version_info.outputs.filename_version }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.filename }}
          path: ${{ steps.package.outputs.dir }}/${{ steps.package.outputs.filename }}
          archive: false

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.dir }}/${{ steps.package.outputs.filename }}
          prerelease: ${{ steps.version_info.outputs.type != 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Arch Linux 打包：GitHub 无原生 Arch hosted runner，因此在 Arch 容器中
  # 原生构建 Nuitka 产物，避免将 Ubuntu/WebKitGTK 的编译期路径带入 Arch 包。
  build-arch-pkg:
    name: Build Arch Linux package
    # 只等待共用前端产物，随后与其他平台的后端矩阵并行构建。
    needs: build-frontend
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    outputs:
      package_artifact: ${{ steps.arch_package.outputs.filename }}
    permissions:
      contents: read
    steps:
      - name: Bootstrap Git for checkout
        # archlinux:base-devel 不包含 Git；checkout 的 REST 回退模式不支持子模块。
        run: pacman -Syu --needed --noconfirm git

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG=""
          VTYPE=""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          fi
          VER="0.0.0"
          if [ -n "$TAG" ]; then
            VER="${TAG#v}"
            if [[ "$VER" == *-beta* ]]; then
              VTYPE="beta"
            elif [[ "$VER" == *-alpha* ]]; then
              VTYPE="alpha"
            elif [[ "$VER" == *-rc* ]]; then
              VTYPE="rc"
            else
              VTYPE="release"
            fi
            echo "full_version=$VER" >> "$GITHUB_OUTPUT"
            CLEAN="${VER%-*}"
            [ "$CLEAN" != "$VER" ] && VER="$CLEAN"
          else
            echo "full_version=" >> "$GITHUB_OUTPUT"
          fi
          echo "tagname=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkgver=$VER" >> "$GITHUB_OUTPUT"
          echo "version_type=$VTYPE" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "filename_version=$TAG" >> "$GITHUB_OUTPUT"
          else
            # 无 tag 时回退到 version.py 中的版本，避免产物命名为 dev
            VER_PY=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' ECL/foundation/version.py)
            TYPE_PY=$(sed -n 's/^__version_type__ = "\([^"]*\)".*/\1/p' ECL/foundation/version.py)
            if [ -n "$VER_PY" ]; then
              # version.py 已含预发布/构建元数据时直接使用；旧格式（纯版本号+类型）再拼上类型
              if [[ "$VER_PY" != *-* ]] && [ -n "$TYPE_PY" ] && [ "$TYPE_PY" != "release" ]; then
                echo "filename_version=v${VER_PY}-${TYPE_PY}" >> "$GITHUB_OUTPUT"
              else
                echo "filename_version=v${VER_PY}" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "filename_version=dev" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install build toolchain
        run: |
          pacman -S --needed --noconfirm \
            uv \
            gtk3 webkit2gtk-4.1 librsvg libayatana-appindicator \
            xorg-server-xvfb xorg-xauth dbus \
            patchelf curl upx

      - name: Install Python dependencies
        shell: bash
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-arch
          uv pip install --python .venv-arch/bin/python -e ".[dev]"
          .venv-arch/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Generate host dependency manifest
        shell: bash
        run: .venv-arch/bin/python packaging/build-host-dependencies.py

      - name: Smoke test offline plugin dependency installation
        shell: bash
        run: .venv-arch/bin/python -m pytest tests/test_plugin_environment_pool.py tests/test_plugin_package_preparation.py tests/test_plugin_manager_packages.py -q

      - name: Inject build secrets
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          .venv-arch/bin/python - <<'PY'
          import os, re
          path = "ECL/foundation/build_env.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          cid = os.environ.get("CLIENT_ID", "")
          cfk = os.environ.get("CF_API_KEY", "")
          text = re.sub(r'microsoft_client_id\s*=\s*"[^"]*"', f'microsoft_client_id = "{cid}"', text)
          text = re.sub(r'curseforge_api_key\s*=\s*"[^"]*"', f'curseforge_api_key = "{cfk}"', text)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Inject version info into version.py
        shell: bash
        env:
          VTYPE: ${{ steps.ver.outputs.version_type }}
          VVER: ${{ steps.ver.outputs.full_version }}
        run: |
          .venv-arch/bin/python - <<'PY'
          import os, re
          vtype = os.environ.get("VTYPE", "")
          vver = os.environ.get("VVER", "")
          if vtype and vver != "0.0.0":
              path = "ECL/foundation/version.py"
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              text = re.sub(
                  r'''__version__\s*=\s*['"][^'"]*['"]''',
                  f'__version__ = "{vver}"',
                  text,
              )
              text = re.sub(
                  r'''__version_type__\s*=\s*['"][^'"]*['"]''',
                  f'__version_type__ = "{vtype}"',
                  text,
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
              print(f"Injected version={vver}, version_type={vtype}")
          else:
              print("No tag detected, keeping existing version.py")
          PY

      - name: Build Arch binary with Nuitka
        shell: bash
        run: |
          .venv-arch/bin/python -m nuitka \
            --mode=onefile --onefile-no-compression --enable-plugin=upx \
            --assume-yes-for-downloads --output-dir=build-nuitka \
            --include-package=ECL \
            --include-package=pytauri \
            --include-package=pytauri_plugins \
            --include-package=pytauri_utils \
            --include-package=pytauri_wheel \
            --include-module=pytauri_wheel.ext_mod \
            --include-distribution-metadata=pytauri-wheel \
            --include-package-data=easytier_pyo3 \
            --include-raw-dir=resources=resources \
            --include-data-dir=frontend/dist=frontend/dist \
            --include-data-dir=capabilities=capabilities \
            --include-data-files=Tauri.toml=Tauri.toml \
            main.py

      - name: Smoke test Arch binary
        shell: bash
        run: |
          set +e
          timeout 30s dbus-run-session -- \
            xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            './build-nuitka/main.bin' > arch-smoke.log 2>&1
          status=$?
          set -e

          cat arch-smoke.log
          if grep -Fq '/usr/lib/x86_64-linux-gnu' arch-smoke.log; then
            echo 'Arch 产物仍在访问 Debian/Ubuntu 的多架构路径' >&2
            exit 1
          fi
          if grep -Eq 'Unable to spawn.*WebKit|SIGTRAP|Traceback \(most recent call last\)' arch-smoke.log; then
            echo 'Arch 产物启动时出现致命错误' >&2
            exit 1
          fi
          # timeout=124 表示 GUI 在冒烟测试结束时仍正常运行；提前退出也应失败。
          if [ "$status" -ne 124 ]; then
            echo "Arch 产物异常退出，status=$status" >&2
            exit 1
          fi

      - name: Smoke test Arch plugin directories
        shell: bash
        env:
          PYTHONUTF8: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          .venv-arch/bin/python -m pip download --only-binary=:all: --no-deps --dest build/plugin-smoke-wheels xxhash==3.6.0
          export ECL_PLUGIN_SMOKE_WHEELS="$GITHUB_WORKSPACE/build/plugin-smoke-wheels"
          export ECL_PLUGIN_SMOKE_EXECUTABLE="$GITHUB_WORKSPACE/build-nuitka/main.bin"
          dbus-run-session -- xvfb-run -a .venv-arch/bin/python -m pytest tests/test_packaged_plugin_directories.py -q

      - name: Prepare source for PKGBUILD
        working-directory: packaging/arch
        shell: bash
        run: |
          SRC="$GITHUB_WORKSPACE/build-nuitka/main.bin"
          [ -x "$SRC" ] || { echo "未找到 Arch 原生二进制"; exit 1; }
          cp "$SRC" euoracraft-launcher
          cp "$SRC" "$GITHUB_WORKSPACE/EuoraCraft-Launcher-Arch-X64-${{ steps.ver.outputs.filename_version }}"
          # CI 用本 job 的 Arch 原生产物，把 PKGBUILD 的远程 source 换成本地二进制。
          sed -i 's#^.*euoracraft-launcher::.*$#    "euoracraft-launcher"#' PKGBUILD

      - name: Build package
        working-directory: packaging/arch
        shell: bash
        env:
          PKGVER: ${{ steps.ver.outputs.pkgver }}
        run: |
          sed -i 's#^pkgver=.*#pkgver='"$PKGVER"'#' PKGBUILD
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE/packaging/arch"
          su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f -c --noconfirm --skipinteg"

      - name: Locate main Arch package
        id: arch_package
        working-directory: packaging/arch
        shell: bash
        run: |
          mapfile -t packages < <(
            find . -maxdepth 1 -type f \
              -name 'euoracraft-launcher-*.pkg.tar.zst' \
              ! -name 'euoracraft-launcher-debug-*.pkg.tar.zst' \
              -printf '%f\n' | sort
          )
          if [ "${#packages[@]}" -ne 1 ]; then
            printf '预期找到 1 个 Arch 主包，实际找到 %s 个：%s\n' \
              "${#packages[@]}" "${packages[*]}" >&2
            exit 1
          fi
          echo "filename=${packages[0]}" >> "$GITHUB_OUTPUT"
          echo "path=packaging/arch/${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Arch package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.arch_package.outputs.filename }}
          path: ${{ steps.arch_package.outputs.path }}
          archive: false

      - name: Upload Arch binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: EuoraCraft-Launcher-Arch-X64-${{ steps.ver.outputs.filename_version }}
          path: EuoraCraft-Launcher-Arch-X64-${{ steps.ver.outputs.filename_version }}
          archive: false

  publish-arch:
    name: Publish Arch-x64
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-backend, build-arch-pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Arch package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-arch-pkg.outputs.package_artifact }}
          path: release-assets

      - name: Download Arch binary
        uses: actions/download-artifact@v8
        with:
          name: EuoraCraft-Launcher-Arch-X64-${{ github.ref_name }}
          path: release-assets

      - name: Upload Arch artifacts to Release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_FILE="release-assets/${{ needs.build-arch-pkg.outputs.package_artifact }}"
          ARCH_BIN="release-assets/EuoraCraft-Launcher-Arch-X64-$TAG"
          [ -f "$PKG_FILE" ] || { echo "未找到 Arch 主包：$PKG_FILE" >&2; exit 1; }
          [ -f "$ARCH_BIN" ] || { echo "未找到 Arch 二进制：$ARCH_BIN" >&2; exit 1; }
          echo "uploading $PKG_FILE and $ARCH_BIN to $TAG"
          # 本发布 Job 未 checkout 仓库，必须显式指定目标仓库，避免 gh 调用 git 推断仓库失败。
          gh release upload "$TAG" "$PKG_FILE" "$ARCH_BIN" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
