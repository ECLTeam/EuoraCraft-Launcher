name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v，例如 0.3.0 或 0.3.0-beta.1；勾选发布时必填，未勾选可留空使用源码版本）'
        required: false
        type: string
      version_type:
        description: '版本类型'
        required: false
        type: choice
        options: [auto, alpha, beta, rc, release]
        default: auto
      publish:
        description: '创建版本标签并发布 GitHub Release（仅 main 分支）'
        required: false
        type: boolean
        default: false
      design_base:
        description: '前端设计检查的主仓库基线提交 SHA（留空与上一提交比较）'
        required: false
        type: string

jobs:
  validate-release-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      full_version: ${{ steps.release.outputs.full_version }}
      type: ${{ steps.release.outputs.type }}
      filename_version: ${{ steps.release.outputs.filename_version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve version and validate publication
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ECL_MANUAL_VERSION: ${{ inputs.version }}
          ECL_MANUAL_VERSION_TYPE: ${{ inputs.version_type }}
          ECL_MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          python packaging/release_metadata.py >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.release.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.filename_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

  build-frontend:
    name: Build Frontend
    needs: validate-release-tag
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend quality
        env:
          # 标签构建检查当前提交相对父提交的增量；此前增量由 main 的质量 CI 连续验证。
          ECL_DESIGN_BASE: ${{ inputs.design_base || format('{0}^', github.sha) }}
          ECL_DESIGN_TARGET: ${{ github.sha }}
          ECL_DESIGN_SUPERPROJECT: ..
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # build backend with matrix
  build-backend:
    name: Build Backend
    needs: [validate-release-tag, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install UPX
        if: ${{ runner.os != 'macOS' && matrix.os != 'windows-11-arm' }}
        uses: crazy-max/ghaction-upx@v4
        with:
          version: v5.2.0
          install-only: true

      - name: Inject build secrets
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
          LITTLESKIN_CLIENT_SECRET: ${{ secrets.LITTLESKIN_CLIENT_SECRET }}
          LITTLESKIN_REDIRECT_URI: ${{ secrets.LITTLESKIN_REDIRECT_URI }}
        run: |
          python - <<'PY'
          import json, os, re
          path = "ECL/utils/build_env.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          cid = os.environ.get("CLIENT_ID", "")
          cfk = os.environ.get("CF_API_KEY", "")
          text = re.sub(r'microsoft_client_id\s*=\s*"[^"]*"', f'microsoft_client_id = "{cid}"', text)
          text = re.sub(r'curseforge_api_key\s*=\s*"[^"]*"', f'curseforge_api_key = "{cfk}"', text)
          for attribute in ("littleskin_client_id", "littleskin_client_secret", "littleskin_redirect_uri"):
              value = os.environ.get(attribute.upper(), "")
              assignment = f"{attribute} = {json.dumps(value, ensure_ascii=True)}"
              text = re.sub(rf'{attribute}\s*=\s*"[^\n]*"', lambda match: assignment, text)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Inject version info into version.py
        shell: bash
        env:
          VTYPE: ${{ needs.validate-release-tag.outputs.type }}
          VVER: ${{ needs.validate-release-tag.outputs.full_version }}
        run: |
          python - <<'PY'
          import os, re
          vtype = os.environ["VTYPE"]
          vver = os.environ["VVER"]
          if not vtype or not vver:
              raise ValueError("构建版本信息缺失")
          path = "ECL/version.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          # Update __version__ with the full version (pre-release and build metadata included)
          text = re.sub(
              r"""__version__\s*=\s*['"][^'"]*['"]""",
              f'__version__ = "{vver}"',
              text,
          )
          # Update __version_type__
          text = re.sub(
              r"""__version_type__\s*=\s*['"][^'"]*['"]""",
              f'__version_type__ = "{vtype}"',
              text,
          )
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print(f"Injected version={vver}, version_type={vtype}")
          PY

      - name: Generate host dependency manifest
        shell: bash
        run: python packaging/build-host-dependencies.py

      # 全部平台统一由 PyInstaller 打包：macOS 出 .app bundle（后续压成 DMG），
      # 其余平台出单文件可执行程序；打包内容与排除项见 EuoraCraft-Launcher.spec。
      - name: Build with PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          # windows-11-arm 没有可用的 UPX ARM64 发行版，关闭 UPX 避免 PyInstaller 反复探测。
          if [ "${{ matrix.os }}" = "windows-11-arm" ]; then
            export ECL_UPX=0
          fi
          python -m PyInstaller --noconfirm --clean "EuoraCraft-Launcher.spec"

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          FILENAME="EuoraCraft-Launcher-${{ runner.os }}-${{ runner.arch }}-${{ needs.validate-release-tag.outputs.filename_version }}"
          echo "dir=dist" >> "$GITHUB_OUTPUT"
          if [ "${{ runner.os }}" = "macOS" ]; then
            hdiutil create -volname "EuoraCraft Launcher" -srcfolder "dist/EuoraCraft Launcher.app" -ov -format UDZO "dist/$FILENAME.dmg"
            echo "filename=$FILENAME.dmg" >> "$GITHUB_OUTPUT"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            mv "dist/EuoraCraft Launcher.exe" "dist/$FILENAME.exe"
            echo "filename=$FILENAME.exe" >> "$GITHUB_OUTPUT"
          else
            mv "dist/EuoraCraft Launcher" "dist/$FILENAME"
            echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.filename }}
          path: ${{ steps.package.outputs.dir }}/${{ steps.package.outputs.filename }}
          archive: false

      - name: Upload to Release
        if: needs.validate-release-tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate-release-tag.outputs.filename_version }}
          files: |
            ${{ steps.package.outputs.dir }}/${{ steps.package.outputs.filename }}
          prerelease: ${{ needs.validate-release-tag.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Arch Linux 打包：GitHub 无原生 Arch hosted runner，因此在 Arch 容器中
  # 原生构建 PyInstaller 产物，避免将 Ubuntu/WebKitGTK 的编译期路径带入 Arch 包。
  build-arch-pkg:
    name: Build Arch Linux package
    # 只等待共用前端产物，随后与其他平台的后端矩阵并行构建。
    needs: [validate-release-tag, build-frontend]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    outputs:
      package_artifact: ${{ steps.arch_package.outputs.filename }}
    permissions:
      contents: read
    steps:
      - name: Bootstrap Git for checkout
        # archlinux:base-devel 不包含 Git；checkout 的 REST 回退模式不支持子模块。
        run: pacman -Syu --needed --noconfirm git

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install build toolchain
        run: |
          pacman -S --needed --noconfirm \
            uv \
            gtk3 webkit2gtk-4.1 librsvg libayatana-appindicator \
            dbus \
            patchelf curl upx

      - name: Install Python dependencies
        shell: bash
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv-arch
          uv pip install --python .venv-arch/bin/python -e ".[dev]"
          .venv-arch/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Generate host dependency manifest
        shell: bash
        run: .venv-arch/bin/python packaging/build-host-dependencies.py

      - name: Inject build secrets
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          LITTLESKIN_CLIENT_ID: ${{ secrets.LITTLESKIN_CLIENT_ID }}
          LITTLESKIN_CLIENT_SECRET: ${{ secrets.LITTLESKIN_CLIENT_SECRET }}
          LITTLESKIN_REDIRECT_URI: ${{ secrets.LITTLESKIN_REDIRECT_URI }}
        run: |
          .venv-arch/bin/python - <<'PY'
          import json, os, re
          path = "ECL/utils/build_env.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          cid = os.environ.get("CLIENT_ID", "")
          cfk = os.environ.get("CF_API_KEY", "")
          text = re.sub(r'microsoft_client_id\s*=\s*"[^"]*"', f'microsoft_client_id = "{cid}"', text)
          text = re.sub(r'curseforge_api_key\s*=\s*"[^"]*"', f'curseforge_api_key = "{cfk}"', text)
          for attribute in ("littleskin_client_id", "littleskin_client_secret", "littleskin_redirect_uri"):
              value = os.environ.get(attribute.upper(), "")
              assignment = f"{attribute} = {json.dumps(value, ensure_ascii=True)}"
              text = re.sub(rf'{attribute}\s*=\s*"[^\n]*"', lambda match: assignment, text)
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Inject version info into version.py
        shell: bash
        env:
          VTYPE: ${{ needs.validate-release-tag.outputs.type }}
          VVER: ${{ needs.validate-release-tag.outputs.full_version }}
        run: |
          .venv-arch/bin/python - <<'PY'
          import os, re
          vtype = os.environ["VTYPE"]
          vver = os.environ["VVER"]
          if not vtype or not vver:
              raise ValueError("构建版本信息缺失")
          path = "ECL/version.py"
          with open(path, encoding="utf-8") as f:
              text = f.read()
          text = re.sub(
              r'''__version__\s*=\s*['"][^'"]*['"]''',
              f'__version__ = "{vver}"',
              text,
          )
          text = re.sub(
              r'''__version_type__\s*=\s*['"][^'"]*['"]''',
              f'__version_type__ = "{vtype}"',
              text,
          )
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print(f"Injected version={vver}, version_type={vtype}")
          PY

      - name: Build Arch binary with PyInstaller
        shell: bash
        run: .venv-arch/bin/python -m PyInstaller --noconfirm --clean "EuoraCraft-Launcher.spec"

      - name: Prepare source for PKGBUILD
        working-directory: packaging/arch
        shell: bash
        run: |
          SRC="$GITHUB_WORKSPACE/dist/EuoraCraft Launcher"
          [ -x "$SRC" ] || { echo "未找到 Arch 原生二进制"; exit 1; }
          cp "$SRC" euoracraft-launcher
          cp "$SRC" "$GITHUB_WORKSPACE/EuoraCraft-Launcher-Arch-X64-${{ needs.validate-release-tag.outputs.filename_version }}"
          # CI 用本 job 的 Arch 原生产物，把 PKGBUILD 的远程 source 换成本地二进制。
          sed -i 's#^.*euoracraft-launcher::.*$#    "euoracraft-launcher"#' PKGBUILD

      - name: Build package
        working-directory: packaging/arch
        shell: bash
        env:
          PKGVER: ${{ needs.validate-release-tag.outputs.version }}
        run: |
          sed -i 's#^pkgver=.*#pkgver='"$PKGVER"'#' PKGBUILD
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE/packaging/arch"
          su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f -c --noconfirm --skipinteg"

      - name: Locate main Arch package
        id: arch_package
        working-directory: packaging/arch
        shell: bash
        run: |
          mapfile -t packages < <(
            find . -maxdepth 1 -type f \
              -name 'euoracraft-launcher-*.pkg.tar.zst' \
              ! -name 'euoracraft-launcher-debug-*.pkg.tar.zst' \
              -printf '%f\n' | sort
          )
          if [ "${#packages[@]}" -ne 1 ]; then
            printf '预期找到 1 个 Arch 主包，实际找到 %s 个：%s\n' \
              "${#packages[@]}" "${packages[*]}" >&2
            exit 1
          fi
          echo "filename=${packages[0]}" >> "$GITHUB_OUTPUT"
          echo "path=packaging/arch/${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Arch package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.arch_package.outputs.filename }}
          path: ${{ steps.arch_package.outputs.path }}
          archive: false

      - name: Upload Arch binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: EuoraCraft-Launcher-Arch-X64-${{ needs.validate-release-tag.outputs.filename_version }}
          path: EuoraCraft-Launcher-Arch-X64-${{ needs.validate-release-tag.outputs.filename_version }}
          archive: false

  publish-arch:
    name: Publish Arch-x64
    if: needs.validate-release-tag.outputs.publish == 'true'
    needs: [validate-release-tag, build-backend, build-arch-pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Arch package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-arch-pkg.outputs.package_artifact }}
          path: release-assets

      - name: Download Arch binary
        uses: actions/download-artifact@v8
        with:
          name: EuoraCraft-Launcher-Arch-X64-${{ needs.validate-release-tag.outputs.filename_version }}
          path: release-assets

      - name: Upload Arch artifacts to Release
        shell: bash
        env:
          TAG: ${{ needs.validate-release-tag.outputs.filename_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_FILE="release-assets/${{ needs.build-arch-pkg.outputs.package_artifact }}"
          ARCH_BIN="release-assets/EuoraCraft-Launcher-Arch-X64-$TAG"
          [ -f "$PKG_FILE" ] || { echo "未找到 Arch 主包：$PKG_FILE" >&2; exit 1; }
          [ -f "$ARCH_BIN" ] || { echo "未找到 Arch 二进制：$ARCH_BIN" >&2; exit 1; }
          echo "uploading $PKG_FILE and $ARCH_BIN to $TAG"
          # 本发布 Job 未 checkout 仓库，必须显式指定目标仓库，避免 gh 调用 git 推断仓库失败。
          gh release upload "$TAG" "$PKG_FILE" "$ARCH_BIN" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
