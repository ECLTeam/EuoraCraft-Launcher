name: Frontend Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      design_base:
        description: '设计检查的主仓库基线提交 SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend quality
        env:
          ECL_DESIGN_BASE: ${{ inputs.design_base || github.event.pull_request.base.sha || github.event.before }}
          ECL_DESIGN_TARGET: ${{ github.sha }}
          ECL_DESIGN_SUPERPROJECT: ..
          ECL_DESIGN_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: pnpm check
