name: Frontend Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      design_base:
        description: '设计检查的主仓库基线提交 SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR 按改动范围选择检查；主分支推送与手动运行保持全量，发布门禁依赖 main 推送的成功记录。
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - "frontend"
              - "frontend/**"
              - ".github/workflows/frontend-checks.yml"

  check:
    name: Check frontend quality
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend quality
        env:
          ECL_DESIGN_BASE: ${{ inputs.design_base || github.event.pull_request.base.sha || github.event.before }}
          ECL_DESIGN_TARGET: ${{ github.sha }}
          ECL_DESIGN_SUPERPROJECT: ..
          ECL_DESIGN_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: pnpm check
