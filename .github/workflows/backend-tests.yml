name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR 按改动范围选择检查；主分支推送与手动运行保持全量，发布门禁依赖 main 推送的成功记录。
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "ECL/**"
              - "native/**"
              - "packaging/**"
              - "tests/**"
              - "tools/**"
              - "main.py"
              - "pyproject.toml"
              - ".github/workflows/backend-tests.yml"

  pytest:
    name: Run pytest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check ECL tests

      # Core 子模块自带 ruff.toml；其 per-file-ignores 以子仓库为根解析，
      # 因此必须在子仓库目录内执行。主仓库 pyproject 的 exclude 会把 ECL/game 排除，
      # 该步骤是 Core 代码唯一的质量门禁。
      - name: Run ruff (Core submodule)
        working-directory: ECL/game
        run: ruff check .

      - name: Run pytest
        run: python -m pytest --tb=short -q

      # Core 测试导入 ECL.game.* 命名空间，依赖主仓库目录结构，只能在主仓库根目录执行。
      - name: Run pytest (Core submodule)
        run: python -m pytest ECL/game/tests --tb=short -q
