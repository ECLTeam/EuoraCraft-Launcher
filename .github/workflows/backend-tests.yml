name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check ECL tests

      # Core 子模块自带 ruff.toml；其 per-file-ignores 以子仓库为根解析，
      # 因此必须在子仓库目录内执行。主仓库 pyproject 的 exclude 会把 ECL/game 排除，
      # 该步骤是 Core 代码唯一的质量门禁。
      - name: Run ruff (Core submodule)
        working-directory: ECL/game
        run: ruff check .

      - name: Run pytest
        run: python -m pytest --tb=short -q

      # Core 测试导入 ECL.game.* 命名空间，依赖主仓库目录结构，只能在主仓库根目录执行。
      - name: Run pytest (Core submodule)
        run: python -m pytest ECL/game/tests --tb=short -q
