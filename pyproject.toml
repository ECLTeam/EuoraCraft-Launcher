[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "EuoraCraft-Launcher"
dynamic = ["version"]
description = "EuoraCraft Launcher"
authors = [
    {name = "ECLTeam", email = "ECL@eclteam.top"},
]
dependencies = [
    "aiofiles>=23.0.0",
    "Pillow>=11.0.0",
    "pytauri-wheel>=0.8.0",
    "pytauri>=0.8.0",
    "anyio>=4.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx[http2]>=0.28.0",
    "mcstatus>=12.0.0",
    "psutil>=7.2.0",
    "packaging>=23.0",
    "installer==0.7.0",
    "easytier-pyo3>=0.1.2",
    "websockets>=13.0"
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "GPL-3.0"}
keywords = ["minecraft", "launcher", "game"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPL-3.0+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/ECLTeam/EuoraCraft-Launcher"
Repository = "https://github.com/ECLTeam/EuoraCraft-Launcher.git"
Issues = "https://github.com/ECLTeam/EuoraCraft-Launcher/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pyinstaller>=6.8.0",
    "python-semantic-release>=9.8.0",
    "tomlkit>=0.13.0",
    "debugpy>=1.8.0",
    "ipython>=8.20.0",
    "pip-tools>=7.4.0",
    "nuitka[onefile]>=4.0",
    "uv==0.12.16"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ECL*"]

[tool.setuptools.dynamic]
version = {attr = "ECL.common.version.__version__"}

[tool.semantic_release]
version_variables = ["ECL/common/version.py:__version__"]
tag_format = "v{version}"
upload_to_pypi = false
upload_to_release = true
build_command = "pip install build && python -m build"
changelog_file = "CHANGELOG.md"

# 版本格式：正式版为 vX.Y.Z；预发布在对应分支上生成 vX.Y.Z-{token}.{序号}，
# 发布时可用 --build-metadata 追加构建日期（如 v1.4.2-alpha.3+20260906）。
[tool.semantic_release.branches.main]
match = "^(main|master)$"
prerelease = false

[tool.semantic_release.branches.alpha]
match = "alpha/.+"
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.branches.beta]
match = "beta/.+"
prerelease = true
prerelease_token = "beta"

[tool.semantic_release.branches.rc]
match = "rc/.+"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "docs", "style", "refactor", "test", "chore"]

[tool.semantic_release.remote]
type = "github"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.euoracraft]
version_type = "alpha"
build_number = 0

[tool.pyinstaller]
spec_file = "EuoraCraft-Launcher.spec"
onefile = true
console = true
icon = "resources/img/logo.ico"
name = "EuoraCraft Launcher"

[tool.release]
enabled = true
auto_tag = true
platforms = ["windows"]
architectures = ["x64"]

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4
exclude = [
    "EuoraCraftLauncher-UI",
    "frontend",
    "ECL/game",
    "ECL/services/florolding",
    "ECL_Libs",
    "resources",
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "C90", # mccabe complexity
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "N818",   # Exception name should end with Error
    "N999",   # Invalid module name (ECL is project‑specific)
    "RUF001", # Ambiguous unicode char in strings (false positives in Chinese)
    "RUF002", # Ambiguous unicode char in docstrings (false positives in Chinese)
    "RUF003", # Ambiguous unicode char in comments (false positives in Chinese)
    "RUF012", # Mutable class attributes should use typing.ClassVar
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["ECL"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
